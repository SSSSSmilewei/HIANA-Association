name: App

on:
  pull_request:
    paths: ["app/**"]
  push:
    branches: ["app/**"] # 推到 app/ 开头的分支就构建一个试用 APK
    tags: ["app-v*"]
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 生成平台工程目录
        run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - run: flutter pub get
      - name: 不允许 Material 控件
        run: ./tool/check_no_material.sh
      - name: 静态检查（只有错误才失败，风格提示不挡构建）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
        continue-on-error: true # 还没写 App 端测试时不阻塞

  apk:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: hiana-app-apk
          path: app/build/app/outputs/flutter-apk/*.apk
