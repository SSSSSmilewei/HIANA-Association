name: App

on:
  pull_request:
    paths: ["app/**"]
  push:
    branches: ["app/**", "main"] # app/ 开头的分支出试用 APK；main 上出正式版并发布
    tags: ["app-v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # 发布问题清单要用
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 生成平台工程目录
        run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - run: flutter pub get
      - name: 不允许 Material 控件
        run: ./tool/check_no_material.sh
      - name: 静态检查（只有错误才失败，风格提示不挡构建）
        id: analyze
        continue-on-error: true
        run: |
          set +e
          # --format=machine 只有 dart analyze 支持；机器格式的输出位置随版本不同，两路都收
          dart analyze --no-fatal-warnings --format=machine > analyze.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # 错误排在前面，警告其次；每行：级别|类型|代码|文件|行|列|长度|说明
          { grep '^ERROR' analyze.txt; grep '^WARNING' analyze.txt; } \
            | awk -F'|' '{f=$4; sub(/.*\/app\//, "app/", f); printf "%s %s:%s:%s %s（%s）\n", $1, f, $5, $6, $8, $3}' > issues.txt
          # 解析不出问题但命令失败时（例如参数写错），把原始输出放进去，至少看得到原因
          if [ ! -s issues.txt ]; then head -10 analyze.txt | sed 's/^/RAW /' > issues.txt; fi
          echo "共 $(wc -l < issues.txt) 条错误和警告"
          cat issues.txt
      # 把完整的问题清单写成一条单独的检查结果，在 PR / 提交页面和接口里都能直接看到全文
      - name: 发布问题清单
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="analyze 结果" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=dart analyze：$(wc -l < issues.txt) 条" \
            -f "output[summary]=错误在前，警告在后" \
            -f "output[text]=$(head -c 60000 issues.txt)"
      - name: 有错误就停
        if: steps.analyze.outputs.code != '0'
        run: exit 1
      - run: flutter test
        continue-on-error: true # 还没写 App 端测试时不阻塞

  apk:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打 app-v* 标签时发布到 Releases
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - name: 补上联网权限和应用名
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $m || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $m
          sed -i 's|android:label="hiana_app"|android:label="海纳协会"|' $m
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: hiana-app-apk
          path: app/build/app/outputs/flutter-apk/*.apk
      # main 上（或打 app-v* 标签时）把 APK 发布到 GitHub Releases，版本号取 pubspec.yaml。
      # 同一版本号再推一次会覆盖那个版本的安装包；要出新版就改 pubspec 里的 version。
      - name: 读版本号
        id: ver
        run: |
          echo "v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: 发布到 Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('app-v{0}', steps.ver.outputs.v) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          name: 海纳协会 App ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          body: 安卓安装包。大多数手机下载 arm64-v8a 那个；装不上再试 armeabi-v7a。
          files: app/build/app/outputs/flutter-apk/*.apk
