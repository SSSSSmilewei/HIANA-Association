name: App

on:
  pull_request:
    paths: ["app/**"]
  push:
    branches: ["app/**"] # 推到 app/ 开头的分支就构建一个试用 APK
    tags: ["app-v*"]
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 生成平台工程目录
        run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - run: flutter pub get
      - name: 不允许 Material 控件
        run: ./tool/check_no_material.sh
      - name: 静态检查（只有错误才失败，风格提示不挡构建）
        id: analyze
        continue-on-error: true
        run: |
          set +e
          # --format=machine 只有 dart analyze 支持；机器格式的输出位置随版本不同，两路都收
          dart analyze --no-fatal-warnings --format=machine > analyze.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # 错误排在前面，警告其次；每行：级别|类型|代码|文件|行|列|长度|说明
          { grep '^ERROR' analyze.txt; grep '^WARNING' analyze.txt; } \
            | awk -F'|' '{f=$4; sub(/.*\/app\//, "app/", f); printf "%s %s:%s:%s %s（%s）\n", $1, f, $5, $6, $8, $3}' > issues.txt
          # 解析不出问题但命令失败时（例如参数写错），把原始输出放进去，至少看得到原因
          if [ ! -s issues.txt ]; then head -10 analyze.txt | sed 's/^/RAW /' > issues.txt; fi
          echo "共 $(wc -l < issues.txt) 条错误和警告"
          cat issues.txt
      # GitHub 每一步最多显示 10 条 error、10 条 warning、10 条 notice 注释，分三步最多输出 90 条
      - name: 输出问题注释（1–30）
        if: always()
        run: |
          sed -n '1,30p' issues.txt | awk '{lvl = NR<=10 ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0}'
      - name: 输出问题注释（31–60）
        if: always()
        run: |
          sed -n '31,60p' issues.txt | awk '{lvl = NR<=10 ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0}'
      - name: 输出问题注释（61–90）
        if: always()
        run: |
          sed -n '61,90p' issues.txt | awk '{lvl = NR<=10 ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0}'
      - name: 有错误就停
        if: steps.analyze.outputs.code != '0'
        run: exit 1
      - run: flutter test
        continue-on-error: true # 还没写 App 端测试时不阻塞

  apk:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org win.shanmoew --project-name hiana_app --platforms=android
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: hiana-app-apk
          path: app/build/app/outputs/flutter-apk/*.apk
