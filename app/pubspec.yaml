name: hiana_app
description: 智慧网络算法协会学习平台的手机 App（学员端）。后端与网页端共用 study.shanmoew-denied.win。
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2 # 跟 flutter_miuix 1.3.0 的要求一致

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 界面：HyperOS / miuix 风格。版本以 pubspec.lock 实际解析的为准，写组件前查 .claude/skills/flutter-miuix
  flutter_miuix: ^1.3.0

  flutter_riverpod: ^2.6.1 # 状态管理，不依赖 Material
  dio: ^5.7.0 # 网络请求，拦截器统一加令牌、解析后端的中文错误
  flutter_secure_storage: ^9.2.2 # 令牌存在 Android Keystore / iOS Keychain
  url_launcher: ^6.3.1 # 打开 B 站讲座、CS50 官方页、APK 下载
  package_info_plus: ^8.1.0 # 读当前版本号，配合 /api/app/version 检查更新

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # flutter_miuix 依赖 Material 的文本编辑基建，这一项必须保留；
  # App 自己的代码仍然不使用任何 Material 可见控件（见 tool/check_no_material.sh）
  uses-material-design: true
